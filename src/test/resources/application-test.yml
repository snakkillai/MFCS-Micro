spring:
  application:
    name: mfcs-micro-test

  kafka:
    bootstrap-servers: localhost:9092
    consumer:
      group-id: mfcs-test-group
      auto-offset-reset: earliest
      enable-auto-commit: false

  security:
    oauth2:
      client:
        registration:
          mfcs-api:
            client-id: test-client
            client-secret: test-secret
            authorization-grant-type: client_credentials
            scope: api.read
        provider:
          mfcs-api:
            token-uri: http://localhost:9999/oauth2/token

kafka:
  topics:
    item-creation: item-creation-topic-test

mfcs:
  api:
    base-url: http://localhost:8080/api/v1
    item-endpoint: /items
    timeout-seconds: 5

logging:
  level:
    com.mfcs.micro: DEBUG
